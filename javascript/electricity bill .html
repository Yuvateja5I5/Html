<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let units=prompt(` Enter units:`)
        if (units <=100)
    {
        let bill=units*2;
        alert("bill amount is " + bill)
    }
    else if (units>100 && units<=200)
    {
        let bill=units*3;
        alert("bill amount is " + bill) 
    }
    else{
        let bill=units*5;
        alert("bill amount is " + bill) 

    }
    
    </script>
</body>
</html>
