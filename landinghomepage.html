<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bolder;
        }
        #navbar{
            height: 100px;
            background-color: gold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #logobox,#menubar{
            height: 100px;
            width: 400px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        #logobar img{
            height:200px;
            mix-blend-mode: multiply;
        }
        #menubar a{
            text-decoration: none;
            color: black;
        }
        #menubar a:hover{
            color: red;
        }
        
        
    </style>
</head>
<body>
    <div id="navbar">
        <div id="logobar">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDGde1Z1bBkdh5pmwhMVjCTqrJdSRcUU0Bz2Ttnc41tA&s=10" alt="">
        </div>
        <div id="menubar">
            <a href="">HOME</a>
            <a href="">ABOUT</a>
            <a href="">PROFILE</a>
        </div>
    </div>
</body>
</html>
